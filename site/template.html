<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
<style>
:root{
  --bg:#fbfbfa;--fg:#222;--muted:#6b6b6b;--line:#e6e4df;--side:#f3f2ee;
  --accent:#2b5c8a;--code:#f0efeb;--term:#e8f0f8;--infer:#fff2df;--inferb:#e08a1e;--op:#f1f1f1;--note:#eef7ee;
  --sidew:300px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--fg);font:15.5px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",Helvetica,Arial,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
code{font:0.88em/1.4 "JetBrains Mono",Menlo,Consolas,monospace;background:var(--code);padding:1px 5px;border-radius:4px;color:#1f3a5a}
pre code{background:none;padding:0}
pre:not(.mermaid){background:var(--code);padding:10px 14px;border-radius:6px;overflow:auto;font-size:.85em}
h1{font-size:1.9em;margin:.2em 0 .3em;line-height:1.3}
h2{font-size:1.55em;margin:2.2em 0 .7em;padding-top:.6em;border-top:2px solid var(--line);line-height:1.35}
h3{font-size:1.2em;margin:1.8em 0 .5em}
h4{font-size:1.02em;margin:1.3em 0 .4em;color:#333}
p{margin:.55em 0}
ul,ol{padding-left:1.5em;margin:.4em 0}
li{margin:.18em 0}
li>p{margin:.2em 0}
hr{border:0;border-top:1px solid var(--line);margin:2em 0}
strong{font-weight:600}
blockquote{margin:.9em 0;padding:.55em .9em;border-left:4px solid #bbb;background:#f6f6f4;border-radius:0 6px 6px 0}
blockquote p{margin:.25em 0}
.callout.term{border-left-color:#4a7fb5;background:var(--term)}
.callout.infer{border-left-color:var(--inferb);background:var(--infer)}
.callout.infer p:first-child{font-weight:600;color:#8a4b00}
.callout.opinion{border-left-color:#999;background:var(--op);color:#444}
.callout.note{border-left-color:#5b9c5b;background:var(--note)}
.tbl{overflow-x:auto;margin:.9em 0}
table{border-collapse:collapse;width:100%;font-size:.92em;line-height:1.5}
th,td{border:1px solid var(--line);padding:6px 10px;vertical-align:top;text-align:left}
th{background:#efeeea;font-weight:600;white-space:nowrap}
tr:nth-child(even) td{background:#faf9f6}
pre.mermaid{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 8px;margin:1em 0 .3em;overflow-x:auto;text-align:center;line-height:1.3}
pre.mermaid svg{max-width:100%;height:auto}
pre.mermaid.err{background:#fff0f0;border-color:#e5a3a3;text-align:left;white-space:pre-wrap;font:.8em/1.4 Menlo,monospace;color:#a00}
details{margin:.6em 0 1.2em}details>summary{cursor:pointer;color:var(--accent);font-size:.92em;padding:4px 0}
.figcap{color:var(--muted);font-size:.9em;text-align:center;margin:.1em 0 1.3em}
img{max-width:100%;height:auto;display:block;margin:.8em auto}
.layout{display:flex;min-height:100vh}
nav.side{position:fixed;left:0;top:0;bottom:0;width:var(--sidew);overflow-y:auto;background:var(--side);border-right:1px solid var(--line);padding:18px 14px 40px;font-size:.86em}
nav.side .brand{font-weight:700;font-size:1.05em;margin:0 0 .2em;color:#111}
nav.side .sub{color:var(--muted);font-size:.85em;margin:0 0 .9em}
nav.side .home{display:block;margin:0 0 1em;padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:#fff}
nav.side ul{list-style:none;margin:0;padding:0}
nav.side ul ul{padding-left:12px;display:none}
nav.side li.l2{margin:.15em 0}
nav.side li.l2.open>ul{display:block}
nav.side li.l2>a{font-weight:600;color:#2a2a2a;display:block;padding:3px 6px;border-radius:4px}
nav.side li.l3>a{display:block;color:#555;padding:2px 6px;border-radius:4px;line-height:1.4;font-size:.95em}
nav.side a:hover{background:#e8e6e0;text-decoration:none}
nav.side a.active{background:#dde7f1;color:var(--accent)}
main{margin-left:var(--sidew);padding:34px 52px 90px;max-width:calc(var(--sidew) + 940px);width:100%}
.meta{color:var(--muted);font-size:.9em;margin-bottom:1.4em}
.legend{display:grid;grid-template-columns:1fr;gap:6px;margin:1em 0}
.legend .callout{margin:0}
#tgl{display:none;position:fixed;left:10px;top:10px;z-index:9;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:14px;cursor:pointer}
@media (max-width:1000px){
  nav.side{transform:translateX(-100%);transition:transform .2s;z-index:8}
  nav.side.show{transform:none}
  main{margin-left:0;padding:54px 20px 60px}
  #tgl{display:block}
}
@media print{nav.side,#tgl{display:none}main{margin:0;padding:0;max-width:none}}
</style>
</head>
<body>
<button id="tgl">目录</button>
<div class="layout">
<nav class="side" id="side">
  <p class="brand">{{BRAND}}</p>
  <p class="sub">{{SUB}}</p>
  {{HOME}}
  {{TOC}}
</nav>
<main id="main">
{{BODY}}
</main>
</div>
<script src="{{MERMAID}}"></script>
<script>
(async function(){
  mermaid.initialize({startOnLoad:false, theme:'neutral', securityLevel:'strict',
    fontFamily:'-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Helvetica,Arial,sans-serif',
    flowchart:{useMaxWidth:true, htmlLabels:true, curve:'basis'},
    sequence:{useMaxWidth:true, mirrorActors:false},
    themeVariables:{fontSize:'14px'}});
  const nodes=[...document.querySelectorAll('pre.mermaid')];
  for(const n of nodes){
    const src=n.textContent;
    try{ await mermaid.parse(src); }
    catch(e){ n.classList.add('err'); n.textContent='[mermaid 语法错误] '+(e.message||e)+'\n\n'+src; n.dataset.bad='1'; }
  }
  await mermaid.run({nodes:nodes.filter(n=>!n.dataset.bad)});
  window.__mermaidDone = true;
})();
document.getElementById('tgl').onclick=()=>document.getElementById('side').classList.toggle('show');
(function(){
  const links=[...document.querySelectorAll('nav.side a')];
  const byId=Object.fromEntries(links.map(a=>[a.getAttribute('href').slice(1),a]));
  const heads=[...document.querySelectorAll('main h2, main h3')];
  let ticking=false;
  function update(){
    ticking=false;
    let cur=heads[0];
    for(const h of heads){ if(h.getBoundingClientRect().top<=90) cur=h; else break; }
    if(!cur) return;
    links.forEach(a=>a.classList.remove('active'));
    const a=byId[cur.id]; if(!a) return;
    a.classList.add('active');
    document.querySelectorAll('nav.side li.l2').forEach(li=>li.classList.remove('open'));
    const chap=a.closest('li.l2'); if(chap) chap.classList.add('open');
    const r=a.getBoundingClientRect(), s=document.getElementById('side').getBoundingClientRect();
    if(r.top<s.top+40||r.bottom>s.bottom-40) a.scrollIntoView({block:'center'});
  }
  window.addEventListener('scroll',()=>{ if(!ticking){ticking=true;requestAnimationFrame(update);} });
  update();
})();
</script>
</body>
</html>

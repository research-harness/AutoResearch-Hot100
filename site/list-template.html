<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<style>
:root{--bg:#f6f4ef;--fg:#1c1c1c;--muted:#6a645c;--line:#e4ddd2;--panel:#fff;--accent:#8b1e1e;--gold:#c9a227;--max:820px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 320px at 10% -10%,#f3e7c9,transparent 55%),var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",serif}a{color:inherit;text-decoration:none}.wrap{max-width:var(--max);margin:auto;padding:0 22px}.hero{padding:38px 0 22px}.crumb{color:var(--muted);font-size:.9em}.crumb a{color:var(--accent)}.eyebrow{color:var(--gold);font-weight:700;letter-spacing:.12em;font-size:.78em;margin-top:10px}.hero h1{font-size:clamp(1.9rem,4vw,2.8rem);margin:.15em 0 .3em;letter-spacing:-.03em}.hero p{color:#4d4740;max-width:680px}.board{padding:8px 0 70px}.row{display:grid;grid-template-columns:64px 1fr 72px;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px;box-shadow:0 1px 0 rgba(0,0,0,.03)}.row:hover{border-color:#c9b48a;transform:translateY(-1px)}.place{font-size:1.35em;text-align:center;color:var(--accent);font-weight:700}.body strong{display:block;font-size:1.12em}.body em{display:block;font-style:normal;color:#534c44;margin:.15em 0}.body small{color:var(--muted)}.score{font-size:1.45em;font-weight:700;text-align:right;color:var(--accent)}.footer{border-top:1px solid var(--line);padding:22px 0 50px;color:var(--muted);font-size:.9em}.footer a{color:var(--accent)}@media(max-width:700px){.wrap{padding:0 14px}.row{grid-template-columns:48px 1fr 56px}}
</style>
</head>
<body>
<header class="hero"><div class="wrap"><p class="crumb">{{CRUMB}}</p><div class="eyebrow">{{EYEBROW}}</div><h1>{{HEADING}}</h1><p>{{LEAD}}</p></div></header>
<main class="wrap"><section class="board">{{ITEMS}}</section></main>
<footer class="footer"><div class="wrap">AutoResearch Hot 100 · <a href="{{HOME_HREF}}">返回八榜总览</a> · <a href="https://github.com/research-harness/AutoResearch-Hot100">源代码与数据</a></div></footer>
</body>
</html>

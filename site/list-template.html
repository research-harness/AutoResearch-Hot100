<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<style>
:root{--bg:#f7f4ee;--fg:#1b1a17;--muted:#6b655c;--line:#e6dfd3;--panel:#fffcf7;--accent:#6b2c12;--gold:#b0892e;--max:860px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16.5px/1.75 "Iowan Old Style","Songti SC","Noto Serif SC",Georgia,"PingFang SC",serif}a{color:inherit;text-decoration:none}.wrap{max-width:var(--max);margin:auto;padding:0 24px}.hero{padding:36px 0 18px;border-bottom:1px solid var(--line)}.crumb{color:var(--muted);font-size:.9em}.crumb a{color:var(--accent)}.kicker{color:var(--gold);letter-spacing:.14em;font-size:.78em;font-weight:700;margin-top:10px}.hero h1{font-size:clamp(1.9rem,4vw,2.7rem);margin:.12em 0 .3em}.hero p{color:#4a443b;max-width:680px}.board{padding:16px 0 70px}.row{display:grid;grid-template-columns:72px 1fr 64px;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px}.row:hover{border-color:#cbb58a}.place{font-size:1.2em;color:var(--gold);font-weight:700;text-align:center}.body strong{display:block;font-size:1.12em}.body em{display:block;font-style:normal;color:#534c44;margin:.12em 0}.body small{color:var(--muted)}.score{font-size:1.4em;font-weight:700;text-align:right;color:var(--accent)}.footer{border-top:1px solid var(--line);padding:22px 0 50px;color:var(--muted)}.footer a{color:var(--accent)}@media(max-width:700px){.wrap{padding:0 16px}.row{grid-template-columns:52px 1fr 52px}}
</style>
</head>
<body>
<header class="hero"><div class="wrap"><p class="crumb">{{CRUMB}}</p><div class="kicker">{{EYEBROW}}</div><h1>{{HEADING}}</h1><p>{{LEAD}}</p></div></header>
<main class="wrap"><section class="board">{{ITEMS}}</section></main>
<footer class="footer"><div class="wrap">Inside Agentic Science · <a href="{{HOME_HREF}}">返回导读</a> · <a href="https://github.com/research-harness/AutoResearch-Hot100">源代码与数据</a></div></footer>
</body>
</html>
